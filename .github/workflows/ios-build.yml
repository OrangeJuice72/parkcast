name: Build iPhone sideload package
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Standard macOS runner (all listed options use the free public-repository tier)
        type: choice
        default: macos-latest
        options:
          - macos-latest
          - macos-15
          - macos-15-intel
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test core and build ARM64 iPhone app
        run: bash scripts/build-ipa.sh
      - name: Upload unsigned IPA for local signing
        uses: actions/upload-artifact@v4
        with:
          name: ParkCast-unsigned-iphone
          path: |
            dist/ParkCast-unsigned.ipa
            dist/ParkCast-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 3
